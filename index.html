<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <title>Su&Cake POS</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#24251f;background:#f7f6f2;font-synthesis:none;--ink:#24251f;--muted:#85867f;--line:#e9e8e1;--green:#315b48;--pale:#eaf0e9;--orange:#e3a66f;--white:#fff;--shadow:0 8px 26px #323a2910}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.app{max-width:1500px;margin:auto;min-height:100dvh;padding:0 30px 30px}.topbar{height:84px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border-radius:13px;background:var(--green);color:white;display:grid;place-items:center;font-size:19px}.brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.03em}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.top-right{display:flex;gap:18px;align-items:center;color:var(--muted);font-size:13px}.status{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;background:#78a184;border-radius:99px}.history-btn{height:42px;padding:0 15px;border:1px solid var(--line);background:white;border-radius:12px;color:var(--ink);font-weight:600}.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:25px;padding-top:25px;align-items:start}.catalog-head{display:flex;align-items:flex-end;justify-content:space-between;margin:5px 0 22px}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.08em}.catalog-head h2{font-size:25px;margin:6px 0 0;letter-spacing:.01em}.search{width:220px;height:43px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:white;outline:none}.search:focus{border-color:#95ad9a}.categories{display:flex;gap:9px;overflow:auto;padding:0 0 20px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.cat{border:1px solid var(--line);background:white;color:#6f706a;border-radius:99px;padding:10px 17px;white-space:nowrap;font-size:13px}.cat.active{background:var(--green);border-color:var(--green);color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:14px}.product{min-height:194px;text-align:left;border:1px solid var(--line);border-radius:17px;background:white;padding:15px;transition:transform .15s,border-color .15s;box-shadow:0 2px 5px #2f392208}.product:active{transform:scale(.98)}.product:hover{border-color:#b9c8b9}.product-art{height:92px;border-radius:12px;display:grid;place-items:center;font-size:43px;margin-bottom:13px;background:var(--art,#f4eee4)}.product-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.product-name{font-size:14px;font-weight:650}.product-price{font-size:14px;font-weight:700;color:var(--green);white-space:nowrap}.product-meta{color:var(--muted);font-size:11px;margin-top:5px}.empty{grid-column:1/-1;color:var(--muted);padding:40px;text-align:center}.cart{position:sticky;top:18px;background:white;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.cart-head{padding:20px 21px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.cart-head h2{margin:0;font-size:18px}.cart-count{font-size:12px;color:var(--muted)}.cart-items{min-height:180px;max-height:min(42vh,420px);overflow:auto;padding:5px 20px}.cart-empty{height:165px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px}.cart-empty span{display:block;font-size:30px;margin-bottom:8px;opacity:.65}.cart-line{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;border-bottom:1px solid #f0efe9}.line-name{font-weight:650;font-size:13px}.line-price{font-size:12px;color:var(--muted);margin-top:4px}.quantity{display:flex;align-items:center;gap:10px}.qty-btn{border:1px solid var(--line);background:white;width:30px;height:30px;border-radius:9px;font-size:18px;color:var(--green)}.qty{font-size:13px;min-width:13px;text-align:center}.cart-foot{padding:15px 20px 20px;background:#fcfbf8;border-top:1px solid var(--line)}.subtotal{display:flex;justify-content:space-between;font-size:13px;color:#6f706a;margin:2px 0 11px}.total{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700;margin:0 0 17px}.total strong{font-size:25px;color:var(--green)}.checkout{height:51px;width:100%;background:var(--green);color:white;border:0;border-radius:13px;font-weight:700;font-size:15px}.checkout:disabled{opacity:.4;cursor:not-allowed}.clear{border:0;background:none;color:#a4a49d;font-size:12px;padding:8px 0}.cart-foot-row{display:flex;justify-content:space-between;align-items:center}.overlay{position:fixed;inset:0;background:#171a1680;display:grid;place-items:center;padding:18px;z-index:3}.overlay[hidden]{display:none}.modal{width:min(440px,100%);background:white;border-radius:20px;padding:23px;box-shadow:0 20px 70px #1114;max-height:90dvh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:20px}.close{border:0;background:#f3f2ee;width:34px;height:34px;border-radius:50%;font-size:18px}.pay-total{background:#f5f7f3;border-radius:14px;padding:15px;display:flex;justify-content:space-between;align-items:center;margin:16px 0}.pay-total strong{font-size:24px;color:var(--green)}.label{font-size:12px;color:var(--muted);margin:16px 0 8px}.pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.method{border:1px solid var(--line);background:white;border-radius:11px;padding:12px 6px;font-size:13px;color:#60615b}.method.active{border-color:var(--green);background:var(--pale);color:var(--green);font-weight:700}.cash-input{width:100%;height:48px;border:1px solid var(--line);border-radius:11px;padding:0 13px;font-size:18px;outline:none}.change{display:flex;justify-content:space-between;font-size:13px;margin:10px 2px;color:var(--muted)}.change strong{color:var(--ink)}.confirm{width:100%;height:49px;border:0;background:var(--green);color:white;font-weight:700;border-radius:12px;margin-top:15px}.sales-list{max-height:55dvh;overflow:auto}.sale{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.sale strong{display:block;font-size:14px}.sale small{display:block;color:var(--muted);margin-top:5px}.sale-right{text-align:right;white-space:nowrap}.sales-empty{text-align:center;color:var(--muted);padding:35px 0}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#252a25;color:white;border-radius:99px;padding:12px 18px;font-size:13px;z-index:5;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
    .admin-btn{height:42px;padding:0 15px;border:1px solid var(--line);background:white;border-radius:12px;color:var(--ink);font-weight:600}.admin-list{max-height:35dvh;overflow:auto}.admin-item{display:grid;grid-template-columns:40px 1fr auto;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.admin-emoji{height:40px;border-radius:11px;display:grid;place-items:center;font-size:22px;background:#f4eee4}.admin-name{font-weight:650;font-size:13px}.admin-meta{font-size:11px;color:var(--muted);margin-top:4px}.admin-actions{display:flex;gap:6px}.small-btn{height:34px;padding:0 10px;background:white;border:1px solid var(--line);border-radius:9px;color:var(--green);font-size:12px}.small-btn.delete{color:#a05b4d}.admin-form{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:11px;margin:0 0 5px}.field input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;outline:none}.field input:focus{border-color:#95ad9a}.admin-submit{width:100%;height:45px;border:0;background:var(--green);color:white;font-weight:700;border-radius:11px;margin-top:12px}.cancel-edit{border:0;background:none;color:var(--muted);font-size:12px;margin-top:8px}.history-modal{width:min(760px,100%)}.report-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:#f7f7f3;border-radius:13px;margin:12px 0}.report-tools select,.report-tools input{height:39px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:white}.report-tools input{flex:1;min-width:145px}.print-btn{height:39px;border:0;background:var(--green);color:white;border-radius:9px;padding:0 13px}.report-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.report-card{border:1px solid var(--line);border-radius:12px;padding:12px}.report-card span{display:block;font-size:11px;color:var(--muted)}.report-card strong{display:block;margin-top:5px;font-size:18px;color:var(--green)}.report-payments{font-size:12px;color:#66675f;padding:10px 2px;border-bottom:1px solid var(--line)}.sale-actions{display:flex;gap:5px;margin-top:7px;justify-content:flex-end}.sale.voided{opacity:.62}.void-tag{font-size:10px;color:#a05b4d;background:#f7e9e5;padding:3px 7px;border-radius:99px}.history-list{max-height:38dvh;overflow:auto}.sale-action{height:29px;padding:0 8px;background:white;border:1px solid var(--line);border-radius:7px;font-size:11px;color:var(--green)}.sale-action.delete{color:#a05b4d}
    @media(max-width:850px){.app{padding:0 18px 24px}.main{grid-template-columns:minmax(0,1fr) 330px;gap:15px}.grid{grid-template-columns:repeat(2,minmax(130px,1fr))}.search{width:180px}}
    @media(max-width:680px){.app{padding:0 14px calc(92px + env(safe-area-inset-bottom))}.topbar{height:70px}.top-right{gap:7px}.status{display:none}.history-btn,.admin-btn{height:36px;padding:0 9px;font-size:11px}.main{display:block;padding-top:17px}.catalog-head{margin-bottom:16px}.catalog-head h2{font-size:21px}.search{width:145px;height:40px;font-size:13px}.categories{padding-bottom:14px}.grid{gap:10px}.product{min-height:166px;padding:11px;border-radius:14px}.product-art{height:78px;font-size:37px;margin-bottom:10px}.product-name,.product-price{font-size:13px}.cart{position:fixed;z-index:2;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));top:auto;border-radius:18px;box-shadow:0 8px 32px #2223}.cart-head{padding:11px 15px;border:0}.cart-head h2{font-size:15px}.cart-count{font-size:11px}.cart-items{display:none}.cart-foot{padding:0 14px 12px;border:0;background:white;display:grid;grid-template-columns:1fr 145px;gap:10px;align-items:center}.subtotal{display:none}.total{margin:0;display:block;font-size:11px;color:var(--muted)}.total strong{display:block;font-size:20px;margin-top:2px}.checkout{height:46px;font-size:14px}.cart-foot-row{display:contents}.clear{display:none}.grid .empty{padding:28px 10px}.overlay{align-items:end;padding:0}.modal{border-radius:20px 20px 0 0;padding:21px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-height:86dvh}.toast{bottom:calc(86px + env(safe-area-inset-bottom))}}
    @media(min-width:681px) and (max-width:1030px){.grid{grid-template-columns:repeat(2,minmax(135px,1fr))}}
    .cart-actions{display:grid;gap:8px}.reserve-order{height:43px;width:100%;background:white;color:var(--green);border:1px solid #b8c8b9;border-radius:12px;font-weight:700}.reserve-order:disabled{opacity:.4;cursor:not-allowed}.reservation-form{display:grid;gap:12px}.reservation-summary{padding:12px;background:#f7f7f3;border-radius:12px;font-size:13px;line-height:1.7}.reservation-summary strong{color:var(--green)}.reservation-list{max-height:65dvh;overflow:auto}.reservation{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.reservation strong{display:block;font-size:14px}.reservation small{display:block;color:var(--muted);margin-top:5px}.reservation-right{text-align:right;min-width:120px}.reservation-status{font-size:10px;color:#315b48;background:#eaf0e9;border-radius:99px;padding:4px 8px}.reservation-status.cancelled{color:#a05b4d;background:#f7e9e5}.reservation-status.picked{color:#65675f;background:#efefe9}.reservation-actions{display:flex;justify-content:flex-end;gap:5px;margin-top:8px}.reservation-action{height:30px;padding:0 8px;background:white;border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--green)}.reservation-action.delete{color:#a05b4d}
    @media(max-width:680px){.top-right{gap:5px}.history-btn,.admin-btn{padding:0 7px;font-size:10px}.cart-foot{grid-template-columns:1fr 1.2fr}.cart-foot-row{display:block}.cart-actions{grid-template-columns:1fr 1fr;gap:7px}.checkout,.reserve-order{height:45px;font-size:12px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="brand"><div class="logo">SU</div><div><h1>Su&Cake</h1><small>POS結帳系統</small></div></div><div class="top-right"><div class="status"><span class="dot"></span>資料儲存在這台裝置</div><button class="history-btn" id="historyBtn">銷售紀錄</button><button class="history-btn" id="reservationsBtn">預訂清單</button><button class="admin-btn" id="adminBtn">商品管理</button></div></header>
    <main class="main"><section class="catalog"><div class="catalog-head"><div><div class="eyebrow">今日商品</div><h2>選擇商品</h2></div><input id="search" class="search" placeholder="⌕　搜尋商品" aria-label="搜尋商品"></div><nav class="categories" id="categories" aria-label="商品分類"></nav><div class="grid" id="products"></div></section>
      <aside class="cart"><div class="cart-head"><h2>本次訂單</h2><span class="cart-count" id="cartCount">0 件商品</span></div><div class="cart-items" id="cartItems"></div><div class="cart-foot"><div class="cart-foot-row"><button class="clear" id="clearCart">清空訂單</button><div class="subtotal"><span>小計</span><span id="subtotal">NT$ 0</span></div><div class="total"><span>應收金額</span><strong id="total">NT$ 0</strong></div></div><div class="cart-actions"><button class="reserve-order" id="reserveOrder" disabled>建立預訂</button><button class="checkout" id="checkout" disabled>前往結帳</button></div></div></aside>
    </main>
  </div>
  <div class="overlay" id="payOverlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="payTitle"><div class="modal-head"><h2 id="payTitle">完成結帳</h2><button class="close" data-close="payOverlay" aria-label="關閉">×</button></div><div class="pay-total"><span>應收金額</span><strong id="payTotal">NT$ 0</strong></div><div class="label">選擇付款方式</div><div class="pay-methods"><button class="method active" data-method="現金">💵 現金</button><button class="method" data-method="信用卡">💳 信用卡</button><button class="method" data-method="電子支付">📱 電子支付</button></div><div id="cashArea"><div class="label">收取現金</div><input id="cashInput" class="cash-input" type="number" min="0" inputmode="numeric" placeholder="輸入收款金額"><div class="change"><span>找零</span><strong id="change">NT$ 0</strong></div></div><button class="confirm" id="confirmPay">確認收款</button></section></div>
  <div class="overlay" id="historyOverlay" hidden><section class="modal history-modal" role="dialog" aria-modal="true" aria-labelledby="historyTitle"><div class="modal-head"><h2 id="historyTitle">營收報表與銷售紀錄</h2><button class="close" data-close="historyOverlay" aria-label="關閉">×</button></div><div class="report-tools"><select id="reportMode" aria-label="報表類型"><option value="day">日報表</option><option value="month">月報表</option></select><input id="reportDate" type="date" aria-label="報表日期"><button class="print-btn" id="printReport">儲存試算表</button></div><div id="reportSummary"></div><div class="label">訂單明細</div><div class="sales-list history-list" id="salesList"></div></section></div>
  <div class="overlay" id="adminOverlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="adminTitle"><div class="modal-head"><h2 id="adminTitle">商品管理</h2><button class="close" data-close="adminOverlay" aria-label="關閉">×</button></div><div class="admin-list" id="adminList"></div><form class="admin-form" id="productForm"><div class="label" id="formTitle">新增商品</div><input type="hidden" id="editId"><div class="form-grid"><div class="field"><label for="pName">商品名稱</label><input id="pName" maxlength="30" required placeholder="例如：焦糖拿鐵"></div><div class="field"><label for="pPrice">售價（元）</label><input id="pPrice" type="number" min="0" step="1" inputmode="numeric" required placeholder="120"></div><div class="field"><label for="pCategory">分類</label><input id="pCategory" maxlength="20" required placeholder="例如：咖啡"></div><div class="field"><label for="pIcon">商品圖示</label><input id="pIcon" maxlength="8" value="🍽️" required></div><div class="field" style="grid-column:1/-1"><label for="pArt">卡片底色（色碼）</label><input id="pArt" type="color" value="#f3e9dd" style="padding:4px"></div></div><button class="admin-submit" id="saveProduct" type="submit">新增商品</button><button class="cancel-edit" id="cancelEdit" type="button" hidden>取消編輯</button></form></section></div>
  <div class="overlay" id="reservationOverlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="reservationTitle"><div class="modal-head"><h2 id="reservationTitle">建立商品預訂</h2><button class="close" data-close="reservationOverlay" aria-label="關閉">×</button></div><div class="reservation-summary" id="reservationSummary"></div><form class="reservation-form" id="reservationForm"><div class="field"><label for="customerPhone">顧客電話</label><input id="customerPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" pattern="[0-9+() -]{8,20}" required placeholder="例如：0912-345-678"></div><div class="field"><label for="pickupDate">取貨日期</label><input id="pickupDate" type="date" required></div><div class="field"><label for="pickupTime">取貨時間</label><input id="pickupTime" type="time" required></div><button class="admin-submit" type="submit">儲存預訂</button></form></section></div>
  <div class="overlay" id="reservationsListOverlay" hidden><section class="modal history-modal" role="dialog" aria-modal="true" aria-labelledby="reservationsListTitle"><div class="modal-head"><h2 id="reservationsListTitle">預訂清單</h2><button class="close" data-close="reservationsListOverlay" aria-label="關閉">×</button></div><div class="reservation-list" id="reservationsList"></div></section></div>
  <div class="toast" id="toast"></div>
  <script>
    const initialProducts=[
      {id:'latte',name:'拿鐵咖啡',category:'咖啡',price:120,icon:'☕',art:'#f3e9dd'},
      {id:'americano',name:'美式咖啡',category:'咖啡',price:90,icon:'🫘',art:'#eee6da'},
      {id:'cappuccino',name:'卡布奇諾',category:'咖啡',price:130,icon:'☕',art:'#f0e9df'},
      {id:'tea',name:'桂花烏龍',category:'茶飲',price:85,icon:'🍵',art:'#e8eee2'},
      {id:'matcha',name:'抹茶拿鐵',category:'茶飲',price:140,icon:'🍵',art:'#e8eee2'},
      {id:'lemon',name:'蜂蜜檸檬',category:'茶飲',price:100,icon:'🍋',art:'#f5f0d9'},
      {id:'croissant',name:'奶油可頌',category:'點心',price:75,icon:'🥐',art:'#f5e7d5'},
      {id:'cake',name:'檸檬磅蛋糕',category:'點心',price:95,icon:'🍰',art:'#f3e8df'},
      {id:'cookie',name:'手工餅乾',category:'點心',price:55,icon:'🍪',art:'#f0e5d7'}
    ];
    const get=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
    let products=get('riri-products',initialProducts), sales=get('riri-sales',[]), reservations=get('sucake-reservations',[]), cart={}, category='全部', method='現金', activeReservationId=null;
    const money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
    function save(){localStorage.setItem('riri-sales',JSON.stringify(sales));localStorage.setItem('riri-products',JSON.stringify(products));localStorage.setItem('sucake-reservations',JSON.stringify(reservations))}
    function renderCategories(){const cats=['全部',...new Set(products.map(p=>p.category))];document.getElementById('categories').innerHTML=cats.map(c=>`<button class="cat ${category===c?'active':''}" data-category="${safe(c)}">${safe(c)}</button>`).join('')}
    function renderProducts(){const q=document.getElementById('search').value.trim().toLowerCase();const rows=products.filter(p=>(category==='全部'||p.category===category)&&p.name.toLowerCase().includes(q));document.getElementById('products').innerHTML=rows.length?rows.map(p=>`<button class="product" data-product="${safe(p.id)}" aria-label="加入${safe(p.name)}"><div class="product-art" style="--art:${safe(p.art)}">${safe(p.icon)}</div><div class="product-row"><span class="product-name">${safe(p.name)}</span><span class="product-price">${money(p.price)}</span></div><div class="product-meta">${safe(p.category)}</div></button>`).join(''):'<div class="empty">找不到符合的商品</div>'}
    function renderCart(){const entries=Object.entries(cart).filter(([,qty])=>qty>0);const count=entries.reduce((n,[,q])=>n+q,0);const total=entries.reduce((n,[id,q])=>n+(products.find(p=>p.id===id)?.price||0)*q,0);document.getElementById('cartCount').textContent=`${count} 件商品`;document.getElementById('subtotal').textContent=money(total);document.getElementById('total').textContent=money(total);document.getElementById('checkout').disabled=!count;document.getElementById('reserveOrder').disabled=!count;document.getElementById('cartItems').innerHTML=entries.length?entries.map(([id,q])=>{const p=products.find(x=>x.id===id);return p?`<div class="cart-line"><div><div class="line-name">${safe(p.name)}</div><div class="line-price">${money(p.price)} · ${money(p.price*q)}</div></div><div class="quantity"><button class="qty-btn" data-qty="${safe(id)}" data-delta="-1" aria-label="減少">−</button><span class="qty">${q}</span><button class="qty-btn" data-qty="${safe(id)}" data-delta="1" aria-label="增加">+</button></div></div>`:''}).join(''):'<div class="cart-empty"><div><span>🛍️</span>點選左側商品，加入本次訂單</div></div>';document.getElementById('payTotal').textContent=money(total);return total}
    function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
    document.getElementById('categories').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(b){category=b.dataset.category;renderCategories();renderProducts()}});
    document.getElementById('products').addEventListener('click',e=>{const b=e.target.closest('[data-product]');if(b){cart[b.dataset.product]=(cart[b.dataset.product]||0)+1;renderCart()}});
    document.getElementById('cartItems').addEventListener('click',e=>{const b=e.target.closest('[data-qty]');if(b){const id=b.dataset.qty;cart[id]=(cart[id]||0)+Number(b.dataset.delta);if(cart[id]<=0)delete cart[id];renderCart()}});
    document.getElementById('search').addEventListener('input',renderProducts);
    document.getElementById('clearCart').addEventListener('click',()=>{cart={};renderCart()});
    function open(id){document.getElementById(id).hidden=false}function close(id){document.getElementById(id).hidden=true}
    document.getElementById('checkout').addEventListener('click',()=>{if(!renderCart())return;activeReservationId=null;method='現金';document.getElementById('payTitle').textContent='完成結帳';document.querySelectorAll('.method').forEach(b=>b.classList.toggle('active',b.dataset.method===method));document.getElementById('cashArea').hidden=false;document.getElementById('cashInput').value='';document.getElementById('change').textContent=money(0);open('payOverlay');setTimeout(()=>document.getElementById('cashInput').focus(),100)});
    document.querySelector('.pay-methods').addEventListener('click',e=>{const b=e.target.closest('[data-method]');if(!b)return;method=b.dataset.method;document.querySelectorAll('.method').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('cashArea').hidden=method!=='現金'});
    function paymentTotal(){const r=reservations.find(x=>String(x.id)===activeReservationId);return r?Number(r.total||0):renderCart()}
    function openReservationCheckout(r){activeReservationId=String(r.id);method='現金';document.getElementById('payTitle').textContent='預訂取貨收款';document.getElementById('payTotal').textContent=money(r.total);document.querySelectorAll('.method').forEach(b=>b.classList.toggle('active',b.dataset.method===method));document.getElementById('cashArea').hidden=false;document.getElementById('cashInput').value='';document.getElementById('change').textContent=money(0);open('payOverlay');setTimeout(()=>document.getElementById('cashInput').focus(),100)}
    document.getElementById('cashInput').addEventListener('input',()=>{const change=Math.max(0,Number(document.getElementById('cashInput').value||0)-paymentTotal());document.getElementById('change').textContent=money(change)});
    document.getElementById('confirmPay').addEventListener('click',()=>{const reservation=reservations.find(x=>String(x.id)===activeReservationId),total=reservation?Number(reservation.total||0):renderCart();if(method==='現金'&&Number(document.getElementById('cashInput').value||0)<total){toast('收取金額不足');return}const items=reservation?(reservation.items||[]).map(i=>({name:i.name,qty:i.qty,price:i.price})):Object.entries(cart).map(([id,qty])=>{const p=products.find(x=>x.id===id);return p?{name:p.name,qty,price:p.price}:null}).filter(Boolean),time=new Date().toISOString(),sale={id:Date.now(),time,items,total,method,received:method==='現金'?Number(document.getElementById('cashInput').value):total,voided:false};if(reservation){sale.reservationId=reservation.id;reservation.status='picked';reservation.pickedUpAt=time;reservation.updatedAt=time}sales.unshift(sale);save();if(!reservation)cart={};activeReservationId=null;renderCart();close('payOverlay');renderReservations();toast(reservation?'已收款，預訂已完成並計入營收':'結帳完成，已儲存銷售紀錄')});
    document.getElementById('historyBtn').addEventListener('click',()=>{if(!reportDate.value)setReportDateMode();else renderSales();open('historyOverlay')});
    const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function openReservationForm(){if(!renderCart())return;const entries=Object.entries(cart).map(([id,qty])=>{const p=products.find(x=>x.id===id);return p?`${safe(p.name)} ×${qty}`:''}).filter(Boolean),today=localDateKey(new Date());document.getElementById('reservationSummary').innerHTML=`${entries.join('<br>')}<br><strong>預訂金額：${money(renderCart())}</strong>`;const date=document.getElementById('pickupDate');date.min=today;date.value=today;document.getElementById('pickupTime').value='';document.getElementById('customerPhone').value='';open('reservationOverlay')}
    function renderReservations(){const node=document.getElementById('reservationsList'),ordered=[...reservations].sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||`${a.pickupDate}T${a.pickupTime}`.localeCompare(`${b.pickupDate}T${b.pickupTime}`));node.innerHTML=ordered.length?ordered.map(r=>{const status=r.status==='cancelled'?'已取消':r.status==='picked'?'已取貨':'預訂中',statusClass=r.status==='cancelled'?'cancelled':r.status==='picked'?'picked':'',items=(r.items||[]).map(i=>`${safe(i.name)} ×${i.qty}`).join('、');return`<div class="reservation"><div><strong>${safe(r.phone)}</strong><small>取貨：${safe(r.pickupDate)} ${safe(r.pickupTime)}</small><small>${items}</small><small>預訂金額：${money(r.total)}</small></div><div class="reservation-right"><span class="reservation-status ${statusClass}">${status}</span><div class="reservation-actions">${r.status==='pending'?`<button class="reservation-action" data-res-status="picked" data-res-id="${safe(r.id)}">收款並標記已取貨</button><button class="reservation-action" data-res-status="cancelled" data-res-id="${safe(r.id)}">取消</button>`:''}<button class="reservation-action delete" data-res-delete="${safe(r.id)}">刪除</button></div></div></div>`}).join(''):'<div class="sales-empty">目前沒有預訂</div>'}
    document.getElementById('reserveOrder').addEventListener('click',openReservationForm);
    document.getElementById('reservationsBtn').addEventListener('click',()=>{renderReservations();open('reservationsListOverlay')});
    document.getElementById('reservationForm').addEventListener('submit',e=>{e.preventDefault();if(!renderCart())return;const phone=document.getElementById('customerPhone').value.trim(),pickupDate=document.getElementById('pickupDate').value,pickupTime=document.getElementById('pickupTime').value;if(!phone||!pickupDate||!pickupTime)return;const items=Object.entries(cart).map(([id,qty])=>{const p=products.find(x=>x.id===id);return p?{productId:id,name:p.name,qty,price:p.price}:null}).filter(Boolean);if(!items.length)return;reservations.unshift({id:`r-${Date.now()}`,createdAt:new Date().toISOString(),phone,pickupDate,pickupTime,items,total:items.reduce((n,i)=>n+i.price*i.qty,0),status:'pending'});save();cart={};renderCart();close('reservationOverlay');renderReservations();open('reservationsListOverlay');toast('預訂已儲存')});
    document.getElementById('reservationsList').addEventListener('click',e=>{const statusButton=e.target.closest('[data-res-status]'),deleteButton=e.target.closest('[data-res-delete]');if(statusButton){const r=reservations.find(x=>String(x.id)===statusButton.dataset.resId);if(!r)return;const next=statusButton.dataset.resStatus;if(next==='picked'){close('reservationsListOverlay');openReservationCheckout(r);return}if(next==='cancelled'&&!confirm('確定取消這筆預訂？'))return;r.status=next;r.updatedAt=new Date().toISOString();save();renderReservations();toast('預訂已取消')}if(deleteButton){const id=deleteButton.dataset.resDelete;if(!confirm('確定刪除這筆預訂紀錄？'))return;reservations=reservations.filter(r=>String(r.id)!==id);save();renderReservations();toast('預訂紀錄已刪除')}});
    document.getElementById('adminBtn').addEventListener('click',()=>{renderAdmin();resetProductForm();open('adminOverlay')});
    function renderAdmin(){document.getElementById('adminList').innerHTML=products.length?products.map(p=>`<div class="admin-item"><div class="admin-emoji" style="background:${safe(p.art)}">${safe(p.icon)}</div><div><div class="admin-name">${safe(p.name)}</div><div class="admin-meta">${safe(p.category)} · ${money(p.price)}</div></div><div class="admin-actions"><button class="small-btn" data-edit="${safe(p.id)}">編輯</button><button class="small-btn delete" data-delete="${safe(p.id)}">刪除</button></div></div>`).join(''):'<div class="sales-empty">尚未建立商品，請使用下方表單新增</div>'}
    function resetProductForm(){document.getElementById('productForm').reset();document.getElementById('editId').value='';document.getElementById('pIcon').value='🍽️';document.getElementById('pArt').value='#f3e9dd';document.getElementById('formTitle').textContent='新增商品';document.getElementById('saveProduct').textContent='新增商品';document.getElementById('cancelEdit').hidden=true}
    document.getElementById('adminList').addEventListener('click',e=>{const del=e.target.closest('[data-delete]'),edit=e.target.closest('[data-edit]');if(del){const p=products.find(x=>x.id===del.dataset.delete);if(!p)return;products=products.filter(x=>x.id!==p.id);delete cart[p.id];save();renderAdmin();renderCategories();renderProducts();renderCart();toast(`已移除「${p.name}」`)}if(edit){const p=products.find(x=>x.id===edit.dataset.edit);if(!p)return;document.getElementById('editId').value=p.id;document.getElementById('pName').value=p.name;document.getElementById('pPrice').value=p.price;document.getElementById('pCategory').value=p.category;document.getElementById('pIcon').value=p.icon;document.getElementById('pArt').value=p.art;document.getElementById('formTitle').textContent='編輯商品';document.getElementById('saveProduct').textContent='儲存修改';document.getElementById('cancelEdit').hidden=false;document.getElementById('pName').focus()}});
    document.getElementById('cancelEdit').addEventListener('click',resetProductForm);
    document.getElementById('productForm').addEventListener('submit',e=>{e.preventDefault();const id=document.getElementById('editId').value;const product={id:id||`item-${Date.now()}`,name:document.getElementById('pName').value.trim(),price:Number(document.getElementById('pPrice').value),category:document.getElementById('pCategory').value.trim(),icon:document.getElementById('pIcon').value.trim(),art:document.getElementById('pArt').value};if(!product.name||!product.category||!product.icon||!Number.isFinite(product.price)||product.price<0)return;if(id){products=products.map(p=>p.id===id?product:p);toast('商品資料已更新')}else{products.push(product);toast('商品已新增')}save();resetProductForm();renderAdmin();renderCategories();renderProducts();renderCart()});
    const localDateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const reportMode=document.getElementById('reportMode'),reportDate=document.getElementById('reportDate');
    function setReportDateMode(){const today=localDateKey(new Date());reportDate.type=reportMode.value==='month'?'month':'date';reportDate.value=reportMode.value==='month'?today.slice(0,7):today;renderSales()}
    function salesForReport(){const value=reportDate.value;return sales.filter(s=>{const d=new Date(s.time);if(Number.isNaN(d.getTime()))return false;return reportMode.value==='month'?localDateKey(d).startsWith(value):localDateKey(d)===value})}
    function renderSales(){const matched=salesForReport(),active=matched.filter(s=>!s.voided),voided=matched.filter(s=>s.voided);const total=active.reduce((n,s)=>n+Number(s.total||0),0),voidTotal=voided.reduce((n,s)=>n+Number(s.total||0),0);const methods=['現金','信用卡','電子支付'].map(m=>`${m} ${money(active.filter(s=>s.method===m).reduce((n,s)=>n+Number(s.total||0),0))}`).join('　·　');document.getElementById('reportSummary').innerHTML=`<div class="report-summary"><div class="report-card"><span>實收營收</span><strong>${money(total)}</strong></div><div class="report-card"><span>有效訂單</span><strong>${active.length} 筆</strong></div><div class="report-card"><span>已取消金額</span><strong>${money(voidTotal)}</strong></div></div><div class="report-payments">付款方式：${methods}</div>`;const node=document.getElementById('salesList');node.innerHTML=matched.length?matched.map(s=>{const d=new Date(s.time);return`<div class="sale ${s.voided?'voided':''}"><div><strong>${(s.items||[]).map(i=>`${safe(i.name)} ×${i.qty}`).join('、')}</strong><small>${d.toLocaleDateString('zh-TW')} ${d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})} · ${safe(s.method)}${s.voided?' · 已取消':''}</small></div><div class="sale-right">${s.voided?'<span class="void-tag">已取消</span>':''}<strong>${money(s.total)}</strong><small>訂單 #${safe(String(s.id).slice(-5))}</small><div class="sale-actions">${s.voided?'':`<button class="sale-action" data-void="${safe(s.id)}">取消訂單</button>`}<button class="sale-action delete" data-remove="${safe(s.id)}">刪除紀錄</button></div></div></div>`}).join(''):'<div class="sales-empty">這個期間沒有銷售紀錄</div>'}
    reportMode.addEventListener('change',setReportDateMode);reportDate.addEventListener('change',renderSales);
    document.getElementById('salesList').addEventListener('click',e=>{const cancel=e.target.closest('[data-void]'),remove=e.target.closest('[data-remove]');if(cancel){const id=cancel.dataset.void;if(!confirm('確定取消這筆訂單？取消後會保留紀錄，並從營收統計扣除。'))return;const sale=sales.find(s=>String(s.id)===id);if(sale){sale.voided=true;sale.voidTime=new Date().toISOString();save();renderSales();toast('訂單已取消，營收統計已更新')}}if(remove){const id=remove.dataset.remove;if(!confirm('確定永久刪除這筆銷售紀錄？此操作無法復原。'))return;sales=sales.filter(s=>String(s.id)!==id);save();renderSales();toast('銷售紀錄已刪除')}});
    function csvCell(value,text=false){let v=String(value??'');if(text&&/^[=+@\-]/.test(v))v="'"+v;return`"${v.replace(/"/g,'""')}"`}
    document.getElementById('printReport').addEventListener('click',()=>{const matched=salesForReport(),active=matched.filter(s=>!s.voided),voided=matched.filter(s=>s.voided),total=active.reduce((n,s)=>n+Number(s.total||0),0),voidTotal=voided.reduce((n,s)=>n+Number(s.total||0),0),period=reportDate.value,periodLabel=reportMode.value==='month'?`${period} 月報表`:`${period} 日報表`;const rows=[["Su&Cake POS 營收報表"],["報表期間",periodLabel],["實收營收",total],["有效訂單數",active.length],["取消訂單數",voided.length],["取消金額",voidTotal],["付款方式","營收"],...['現金','信用卡','電子支付'].map(m=>[m,active.filter(s=>s.method===m).reduce((n,s)=>n+Number(s.total||0),0)]),[],["訂單編號","交易時間","狀態","付款方式","商品明細","件數","訂單金額"],...matched.map(s=>[String(s.id).slice(-5),new Date(s.time).toLocaleString('zh-TW'),s.voided?'已取消':'有效',s.method,(s.items||[]).map(i=>`${i.name} ×${i.qty}`).join('、'),(s.items||[]).reduce((n,i)=>n+Number(i.qty||0),0),Number(s.total||0)])];const content='\ufeff'+rows.map(row=>row.map((v,i)=>csvCell(v,typeof v==='string')).join(',')).join('\r\n');const blob=new Blob([content],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`SuCake_POS_${reportMode.value==='month'?'月報表':'日報表'}_${period}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('試算表已下載，可用 Excel 或 Numbers 開啟')});
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>close(b.dataset.close)));document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)close(o.id)}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay').forEach(o=>close(o.id))});
    setReportDateMode();renderCategories();renderProducts();renderCart();
  </script>
